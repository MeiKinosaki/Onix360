name: WX360 CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go for independent LZX reference encoder
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Resolve independent LZX encoder modules
        run: go mod tidy
        working-directory: tools/lzx-reference
      - name: Generate independent LZX positive reference vector
        run: go run .
        working-directory: tools/lzx-reference
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package portable Windows ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/WX360/WX360-data/roms, dist/WX360/WX360-data/covers, dist/WX360/WX360-data/saves, dist/WX360/WX360-data/configs | Out-Null
          Copy-Item build/Release/WX360.exe dist/WX360/WX360.exe
          Copy-Item build/Release/WX360-Test.exe dist/WX360/WX360-Test.exe
          Copy-Item README.md dist/WX360/README.txt
          Compress-Archive -Path dist/WX360 -DestinationPath dist/WX360-Windows-x64-Portable.zip -Force
      - name: Upload portable Windows package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: WX360-Windows-x64-Portable
          path: dist/WX360-Windows-x64-Portable.zip
          if-no-files-found: error
